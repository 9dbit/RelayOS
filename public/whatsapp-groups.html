<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Groups · RelayOS</title><link rel="stylesheet" href="/relay-ui.css"><style>body{font-family:Inter,system-ui;background:#f6f7f9;color:#17181d;margin:0}.page{max-width:1280px;margin:0 auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h1{margin:0;font-size:34px}.head p{margin:6px 0 0;color:#777}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#fff;border:1px solid #e7e8ec;border-radius:22px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #dedfe5;border-radius:14px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:76px}.btn{border:0;border-radius:999px;background:#1e1f24;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.muted{color:#8b8e97;font-size:12px}.list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.group{border:1px solid #ececf1;border-radius:16px;padding:12px;cursor:pointer}.group.active{border-color:#7d6be8;background:#f7f5ff}.badge{display:inline-flex;border-radius:999px;background:#f1efff;color:#6652d8;padding:4px 8px;font-size:10px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fafafe;border:1px solid #ececf2;border-radius:16px;padding:12px}.stat b{display:block;font-size:22px}.section{margin-top:18px}.section h3{margin:0 0 10px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eee}.health{font-weight:700}.good{color:#1a9b67}.warn{color:#c08a22}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="page"><div class="head"><div><span class="badge">MULTI-NUMBER ROUTING</span><h1>WhatsApp Agent Groups</h1><p>Group numbers, routing policy, operator pool, and group-specific knowledge.</p></div><button class="btn" id="refresh">Refresh</button></div><div class="grid"><div><div class="card"><h3>Create group</h3><div class="row"><input id="name" placeholder="Group name"><input id="code" placeholder="Group ID (optional)"></div><div class="row3" style="margin-top:10px"><input id="brand" placeholder="Brand"><input id="department" placeholder="Department"><input id="region" placeholder="Region"></div><textarea id="description" placeholder="Purpose / routing notes" style="margin-top:10px"></textarea><div class="row" style="margin-top:10px"><select id="routing"><option value="least_load">Least load</option><option value="health_first">Health first</option><option value="round_robin">Round robin</option><option value="priority">Priority</option></select><input id="minHealth" type="number" min="0" max="100" value="60" placeholder="Min health"></div><button class="btn" id="create" style="margin-top:12px">Create group</button></div><div class="list" id="groups"></div></div><div class="card" id="detail"><div class="muted">Select a group to manage numbers and knowledge.</div></div></div></div><script>let selected='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/v1/whatsapp-groups');groups.innerHTML=d.items.map(g=>`<div class="group ${selected===g.id?'active':''}" onclick="openGroup('${g.id}')"><b>${esc(g.name)}</b><div class="muted">${esc(g.group_code)} · ${g.number_count} numbers · ${g.knowledge_count} KB</div><div class="muted">Health ${g.avg_health} · ${g.open_conversations} open chats</div></div>`).join('')||'<div class="muted">No groups yet.</div>'}async function openGroup(id){selected=id;await load();const g=await api('/api/v1/whatsapp-groups/'+id);detail.innerHTML=`<div style="display:flex;justify-content:space-between"><div><span class="badge">${esc(g.group_code)}</span><h2 style="margin:8px 0 3px">${esc(g.name)}</h2><div class="muted">${esc(g.brand||'No brand')} · ${esc(g.department||'No department')} · ${esc(g.region||'No region')}</div></div><div><span class="badge">${esc(g.routing_mode)}</span></div></div><div class="stats"><div class="stat"><span class="muted">Numbers</span><b>${g.numbers.length}</b></div><div class="stat"><span class="muted">Knowledge</span><b>${g.knowledge.length}</b></div><div class="stat"><span class="muted">Operators</span><b>${g.operators.length}</b></div><div class="stat"><span class="muted">Min health</span><b>${g.min_health_score}</b></div></div><div class="section"><h3>Assign WhatsApp number</h3><div class="row"><input id="waId" placeholder="WhatsApp account UUID"><input id="priority" type="number" value="100" placeholder="Priority"></div><label class="muted"><input id="primary" type="checkbox" style="width:auto"> Primary sender</label> <button class="btn" onclick="addNumber()">Assign number</button>${g.numbers.map(n=>`<div class="item"><div><b>${esc(n.name)}</b><div class="muted">${esc(n.phone)} · ${esc(n.status)} · ${n.open_conversations} chats</div></div><div class="health ${n.health_score>=g.min_health_score?'good':'warn'}">${n.health_score}</div></div>`).join('')||'<div class="muted">No numbers assigned.</div>'}</div><div class="section"><h3>Attach Knowledge Base</h3><div class="row"><input id="knowledgeId" placeholder="Knowledge item UUID"><button class="btn" onclick="addKnowledge()">Attach knowledge</button></div>${g.knowledge.map(k=>`<div class="item"><div><b>${esc(k.title)}</b><div class="muted">${esc(k.category)} · authority ${k.authority_level} · v${k.version_no||'-'}</div></div><span class="badge">${esc(k.status)}</span></div>`).join('')||'<div class="muted">No group knowledge attached.</div>'}</div>`}async function addNumber(){await api('/api/v1/whatsapp-groups/'+selected+'/numbers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({whatsapp_account_id:waId.value,priority:Number(priority.value)||100,is_primary:primary.checked})});openGroup(selected)}async function addKnowledge(){await api('/api/v1/whatsapp-groups/'+selected+'/knowledge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({knowledge_item_id:knowledgeId.value})});openGroup(selected)}create.onclick=async()=>{const g=await api('/api/v1/whatsapp-groups',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.value,group_code:code.value,brand:brand.value,department:department.value,region:region.value,description:description.value,routing_mode:routing.value,min_health_score:Number(minHealth.value)||60})});selected=g.id;await load();openGroup(g.id)};refresh.onclick=load;load();</script></body></html>
