<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Groups · RelayOS</title><link rel="stylesheet" href="/relay-ui.css"><style>
:root{--brand:#befc4f;--brand-ink:#101408}
*{box-sizing:border-box}body{font-family:Inter,system-ui;background:#f6f7f9;color:#17181d;margin:0}.page{max-width:1280px;margin:0 auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h1{margin:0;font-size:34px}.head p{margin:6px 0 0;color:#777}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#fff;border:1px solid #e7e8ec;border-radius:22px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #dedfe5;border-radius:14px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:76px}.btn{border:0;border-radius:999px;background:#1e1f24;color:#fff;padding:11px 18px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:42px;line-height:1}.btn.brand{background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 20px rgba(190,252,79,.16)}.btn.light{background:#f0f1f4;color:#333}.btn.danger{background:#2b2e32;color:#ddd;border:1px solid #44484f}.btn.sm{min-height:34px;padding:7px 12px;font-size:11px}.btn:hover{filter:brightness(1.04)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.full{width:100%;margin-top:10px}.form-status,.action-status{font-size:11px;margin-top:9px;min-height:16px;color:#8b8e97}.form-status.error,.action-status.error{color:#ff7c7c}.form-status.ok,.action-status.ok{color:#8fcd2f}.muted{color:#8b8e97;font-size:12px}.list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.group{border:1px solid #ececf1;border-radius:16px;padding:12px;cursor:pointer}.group.active{border-color:#a8df45;background:#f8ffe9}.group.archived{opacity:.55}.badge{display:inline-flex;border-radius:999px;background:#eff8de;color:#536e22;padding:4px 8px;font-size:10px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fafafe;border:1px solid #ececf2;border-radius:16px;padding:12px}.stat b{display:block;font-size:22px}.section{margin-top:24px}.section h3{margin:0 0 12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid #eee}.item-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.health{font-weight:750}.good{color:#76a925}.warn{color:#8b8e97}.picker{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;align-items:center}.picker.two{grid-template-columns:minmax(0,1fr) 120px}.primary-line{display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;width:auto!important;max-width:100%!important;margin:12px 0 4px!important;cursor:pointer}.primary-line input{appearance:auto!important;-webkit-appearance:checkbox!important;width:18px!important;height:18px!important;min-width:18px!important;max-width:18px!important;flex:0 0 18px!important;margin:0!important;padding:0!important}.primary-line span{display:inline!important;flex:0 1 auto!important;text-align:left!important;white-space:normal!important}.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}.edit-grid .wide{grid-column:1/-1}.empty{padding:12px 0;color:#93969e;font-size:12px}
html[data-theme=dark] body{background:#090b0d!important;color:#f3f5f7!important}html[data-theme=dark] .card,html[data-theme=dark] .group,html[data-theme=dark] .stat{background:#111417!important;border-color:#252a2f!important;color:#f3f5f7!important}html[data-theme=dark] .group.active{background:#151b10!important;border-color:var(--brand)!important}html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#15191d!important;border-color:#30363d!important;color:#f3f5f7!important}html[data-theme=dark] .btn{background:#1a1e22;color:#f4f5f7;border:1px solid #30363d}html[data-theme=dark] .btn.brand{background:var(--brand)!important;color:var(--brand-ink)!important;border-color:var(--brand)!important}html[data-theme=dark] .btn.light{background:#171b1f;color:#f1f3f5;border-color:#30363d}html[data-theme=dark] .btn.danger{background:#171b1f;color:#b8bdc5;border-color:#30363d}html[data-theme=dark] .badge{background:#1c2512!important;color:var(--brand)!important}html[data-theme=dark] .good{color:var(--brand)!important}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.edit-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.page{padding:18px 14px}.head{align-items:flex-start;gap:12px}.head h1{font-size:28px}.row,.row3,.picker,.picker.two,.edit-grid{grid-template-columns:1fr}.detail-head{flex-direction:column}.detail-actions{justify-content:flex-start;width:100%}.btn{width:100%}.item{align-items:flex-start;flex-direction:column}.item-actions{width:100%}.item-actions .btn{width:auto}.stats{grid-template-columns:1fr 1fr}.primary-line{width:auto!important}.primary-line span{font-size:13px!important}}
</style></head><body><div class="page"><div class="head"><div><span class="badge">MULTI-NUMBER ROUTING</span><h1>WhatsApp Agent Groups</h1><p>Group numbers, routing policy, operator pool, and group-specific knowledge.</p></div><button class="btn" id="refreshBtn" type="button">Refresh</button></div><div class="grid"><div><div class="card"><h3>Create group</h3><div class="row"><input id="groupName" placeholder="Group name"><input id="groupCode" placeholder="Group ID (optional)"></div><div class="row3" style="margin-top:10px"><input id="groupBrand" placeholder="Brand"><input id="groupDepartment" placeholder="Department"><input id="groupRegion" placeholder="Region"></div><textarea id="groupDescription" placeholder="Purpose / routing notes" style="margin-top:10px"></textarea><div class="row" style="margin-top:10px"><select id="groupRouting"><option value="least_load">Least load</option><option value="health_first">Health first</option><option value="round_robin">Round robin</option><option value="priority">Priority</option></select><input id="groupMinHealth" type="number" min="0" max="100" value="60" placeholder="Min health"></div><button class="btn brand full" id="createGroupBtn" type="button">Create group</button><div id="createStatus" class="form-status"></div></div><div class="list" id="groups"></div></div><div class="card" id="detail"><div class="muted">Select a group to manage numbers, operators and knowledge.</div></div></div></div>
<script>
let selected='',catalog={numbers:[],knowledge:[],operators:[]};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/login.html';throw Error('Authentication required')}if(!r.ok)throw new Error(d.error||d.detail||('Request failed ('+r.status+')'));return d}
function dedupe(items,keyFn){const seen=new Set();return items.filter(x=>{const k=keyFn(x);if(seen.has(k))return false;seen.add(k);return true})}
async function loadCatalog(){const [n,k,o]=await Promise.all([api('/api/v1/numbers'),api('/api/v1/knowledge/items'),api('/api/v1/operators')]);catalog.numbers=dedupe(n.items||[],x=>String(x.id));catalog.knowledge=dedupe((k.items||[]).filter(x=>x.status==='published'),x=>String(x.id));catalog.operators=dedupe((o.items||[]).filter(x=>x.active!==false),x=>String((x.email||'').toLowerCase()||((x.name||'')+'|'+(x.role||'')+'|'+(x.department||''))))}
async function load(){const d=await api('/api/v1/whatsapp-groups');$('groups').innerHTML=(d.items||[]).map(g=>`<div class="group ${selected===g.id?'active':''} ${g.status==='archived'?'archived':''}" onclick="openGroup('${g.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(g.name)}</b><span class="badge">${esc(g.status)}</span></div><div class="muted">${esc(g.group_code)} · ${g.number_count} numbers · ${g.knowledge_count} KB · ${g.operator_count} operators</div><div class="muted">Health ${g.avg_health} · ${g.open_conversations} open chats</div></div>`).join('')||'<div class="muted">No groups yet.</div>'}
function numberOptions(g){const assigned=new Set(g.numbers.map(x=>x.id));return '<option value="">Choose WhatsApp number…</option>'+catalog.numbers.filter(x=>!assigned.has(x.id)).map(n=>`<option value="${n.id}">${esc(n.name)} · ${esc(n.phone)} · health ${n.health??0} · ${esc(n.status)}</option>`).join('')}
function knowledgeOptions(g){const assigned=new Set(g.knowledge.map(x=>x.id));return '<option value="">Choose published knowledge…</option>'+catalog.knowledge.filter(x=>!assigned.has(x.id)).map(k=>`<option value="${k.id}">${esc(k.title)} · ${esc(k.category)} · v${k.version_no||'-'}</option>`).join('')}
function operatorOptions(g){const assigned=new Set(g.operators.map(x=>x.id));return '<option value="">Choose operator…</option>'+catalog.operators.filter(x=>!assigned.has(x.id)).map(o=>`<option value="${o.id}">${esc(o.name)} · ${esc(o.role)} · ${esc(o.department||'All departments')}</option>`).join('')}
function sectionStatus(id,text,type=''){const el=$(id);if(!el)return;el.className='action-status '+type;el.textContent=text||''}
async function runSection(statusId,fn){sectionStatus(statusId,'Working…');try{await fn();sectionStatus(statusId,'Saved.','ok')}catch(e){sectionStatus(statusId,e.message||'Action failed.','error')}}
async function openGroup(id){selected=id;await Promise.all([load(),loadCatalog()]);const g=await api('/api/v1/whatsapp-groups/'+id);$('detail').innerHTML=`<div class="detail-head"><div><span class="badge">${esc(g.group_code)}</span><h2 style="margin:8px 0 3px">${esc(g.name)}</h2><div class="muted">${esc(g.brand||'No brand')} · ${esc(g.department||'No department')} · ${esc(g.region||'No region')}</div></div><div class="detail-actions"><button type="button" class="btn light sm" onclick="toggleEdit()">Edit group</button><button type="button" class="btn danger sm" onclick="archiveGroup()">${g.status==='archived'?'Archived':'Archive'}</button></div></div><div id="editBox" style="display:none"><div class="edit-grid"><input id="editName" value="${esc(g.name)}" placeholder="Group name"><input id="editBrand" value="${esc(g.brand||'')}" placeholder="Brand"><input id="editDept" value="${esc(g.department||'')}" placeholder="Department"><input id="editRegion" value="${esc(g.region||'')}" placeholder="Region"><select id="editRouting"><option value="least_load" ${g.routing_mode==='least_load'?'selected':''}>Least load</option><option value="health_first" ${g.routing_mode==='health_first'?'selected':''}>Health first</option><option value="round_robin" ${g.routing_mode==='round_robin'?'selected':''}>Round robin</option><option value="priority" ${g.routing_mode==='priority'?'selected':''}>Priority</option></select><input id="editHealth" type="number" min="0" max="100" value="${g.min_health_score}"><textarea class="wide" id="editDescription" placeholder="Purpose / routing notes">${esc(g.description||'')}</textarea></div><button type="button" class="btn brand full" onclick="saveGroup()">Save changes</button></div><div class="stats"><div class="stat"><span class="muted">Numbers</span><b>${g.numbers.length}</b></div><div class="stat"><span class="muted">Knowledge</span><b>${g.knowledge.length}</b></div><div class="stat"><span class="muted">Operators</span><b>${g.operators.length}</b></div><div class="stat"><span class="muted">Min health</span><b>${g.min_health_score}</b></div></div><div class="section"><h3>WhatsApp sender pool</h3><div class="picker two"><select id="waPicker">${numberOptions(g)}</select><input id="waPriority" type="number" value="100" min="1" placeholder="Priority"></div><label class="primary-line"><input id="waPrimary" type="checkbox"><span class="muted">Set as primary sender</span></label><button type="button" class="btn brand full" onclick="addNumber()">Assign number</button><div id="numberStatus" class="action-status"></div>${g.numbers.map(n=>`<div class="item"><div><b>${esc(n.name)} ${n.is_primary?'<span class="badge">PRIMARY</span>':''}</b><div class="muted">${esc(n.phone)} · ${esc(n.status)} · ${n.open_conversations} chats · priority ${n.priority}</div></div><div class="item-actions"><span class="health ${n.health_score>=g.min_health_score?'good':'warn'}">Health ${n.health_score}</span>${!n.is_primary?`<button type="button" class="btn light sm" onclick="makePrimary('${n.id}',${n.priority})">Make primary</button>`:''}<button type="button" class="btn danger sm" onclick="removeNumber('${n.id}')">Remove</button></div></div>`).join('')||'<div class="empty">No numbers assigned.</div>'}</div><div class="section"><h3>Group knowledge</h3><div class="picker"><select id="knowledgePicker">${knowledgeOptions(g)}</select></div><button type="button" class="btn brand full" onclick="addKnowledge()">Attach knowledge</button><div id="knowledgeStatus" class="action-status"></div>${g.knowledge.map(k=>`<div class="item"><div><b>${esc(k.title)}</b><div class="muted">${esc(k.category)} · authority ${k.authority_level} · v${k.version_no||'-'}</div></div><div class="item-actions"><span class="badge">${esc(k.status)}</span><button type="button" class="btn danger sm" onclick="removeKnowledge('${k.id}')">Remove</button></div></div>`).join('')||'<div class="empty">No group knowledge attached.</div>'}</div><div class="section"><h3>Operator pool</h3><div class="picker two"><select id="operatorPicker">${operatorOptions(g)}</select><select id="operatorRole"><option value="member">Member</option><option value="lead">Lead</option></select></div><button type="button" class="btn brand full" onclick="addOperator()">Assign operator</button><div id="operatorStatus" class="action-status"></div>${g.operators.map(o=>`<div class="item"><div><b>${esc(o.name)} <span class="badge">${esc(o.group_role)}</span></b><div class="muted">${esc(o.role)} · ${esc(o.department||'All departments')} · ${esc(o.presence||'offline')}</div></div><button type="button" class="btn danger sm" onclick="removeOperator('${o.id}')">Remove</button></div>`).join('')||'<div class="empty">No operators assigned.</div>'}</div>`}
function toggleEdit(){const e=$('editBox');e.style.display=e.style.display==='none'?'block':'none'}
async function saveGroup(){await api('/api/v1/whatsapp-groups/'+selected,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('editName').value.trim(),brand:$('editBrand').value.trim()||null,department:$('editDept').value.trim()||null,region:$('editRegion').value.trim()||null,description:$('editDescription').value.trim()||null,routing_mode:$('editRouting').value,min_health_score:Number($('editHealth').value)||60})});await openGroup(selected)}
async function archiveGroup(){const g=await api('/api/v1/whatsapp-groups/'+selected);if(g.status==='archived')return;if(!confirm('Archive this group? Existing history remains available.'))return;await api('/api/v1/whatsapp-groups/'+selected,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:'archived'})});await openGroup(selected)}
async function addNumber(){const id=$('waPicker').value;if(!id){sectionStatus('numberStatus','Choose a WhatsApp number first.','error');return}await runSection('numberStatus',async()=>{await api('/api/v1/whatsapp-groups/'+selected+'/numbers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({whatsapp_account_id:id,priority:Number($('waPriority').value)||100,is_primary:$('waPrimary').checked})});await openGroup(selected)})}
async function makePrimary(id,priority){await runSection('numberStatus',async()=>{await api('/api/v1/whatsapp-groups/'+selected+'/numbers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({whatsapp_account_id:id,priority:Number(priority)||100,is_primary:true})});await openGroup(selected)})}
async function removeNumber(id){if(!confirm('Remove this number from the group?'))return;await api('/api/v1/whatsapp-groups/'+selected+'/numbers/'+id,{method:'DELETE'});await openGroup(selected)}
async function addKnowledge(){const id=$('knowledgePicker').value;if(!id){sectionStatus('knowledgeStatus','Choose knowledge first.','error');return}await runSection('knowledgeStatus',async()=>{const r=await api('/api/v1/whatsapp-groups/'+selected+'/knowledge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({knowledge_item_id:id})});if(!r.ok)throw Error(r.error||'Attach failed');await openGroup(selected)})}
async function removeKnowledge(id){await api('/api/v1/whatsapp-groups/'+selected+'/knowledge/'+id,{method:'DELETE'});await openGroup(selected)}
async function addOperator(){const id=$('operatorPicker').value;if(!id){sectionStatus('operatorStatus','Choose an operator first.','error');return}await runSection('operatorStatus',async()=>{await api('/api/v1/whatsapp-groups/'+selected+'/operators',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({operator_id:id,role:$('operatorRole').value})});await openGroup(selected)})}
async function removeOperator(id){await api('/api/v1/whatsapp-groups/'+selected+'/operators/'+id,{method:'DELETE'});await openGroup(selected)}
async function createGroup(){const btn=$('createGroupBtn'),status=$('createStatus');status.className='form-status';status.textContent='';const name=$('groupName').value.trim();if(!name){status.className='form-status error';status.textContent='Group name is required.';$('groupName').focus();return}btn.disabled=true;btn.textContent='Creating…';try{const g=await api('/api/v1/whatsapp-groups',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,group_code:$('groupCode').value.trim()||undefined,brand:$('groupBrand').value.trim()||undefined,department:$('groupDepartment').value.trim()||undefined,region:$('groupRegion').value.trim()||undefined,description:$('groupDescription').value.trim()||undefined,routing_mode:$('groupRouting').value,min_health_score:Number($('groupMinHealth').value)||60})});selected=g.id;status.className='form-status ok';status.textContent='Group created.';await openGroup(g.id)}catch(e){status.className='form-status error';status.textContent=e.message||'Failed to create group.'}finally{btn.disabled=false;btn.textContent='Create group'}}
$('createGroupBtn').addEventListener('click',createGroup);$('refreshBtn').addEventListener('click',()=>{Promise.all([load(),loadCatalog()]).catch(e=>{$('createStatus').className='form-status error';$('createStatus').textContent=e.message})});Promise.all([load(),loadCatalog()]).catch(e=>{$('createStatus').className='form-status error';$('createStatus').textContent=e.message});
</script></body></html>
