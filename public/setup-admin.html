<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RelayOS Admin Setup</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#17181c;background:#f6f7f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9}.card{width:min(470px,calc(100vw - 32px));background:#fff;border:1px solid #e9eaee;border-radius:30px;padding:34px;box-shadow:0 24px 70px #28253b12}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#806ef0,#5d49d8);display:grid;place-items:center;color:white;font-weight:800;margin-bottom:24px}h1{margin:0;font-size:28px}p{color:#858891;font-size:12px;line-height:1.6;margin:8px 0 22px}.field{margin:11px 0}.field label{display:block;font-size:10px;color:#777b84;margin:0 0 7px 4px}.field input{width:100%;border:1px solid #e1e2e6;border-radius:999px;padding:13px 16px;font:13px inherit;outline:0}.btn{width:100%;border:0;border-radius:999px;background:#1e1f24;color:#fff;padding:13px 18px;font-weight:700;cursor:pointer;margin-top:10px}.msg{font-size:11px;margin-top:14px;color:#666;min-height:18px}.warn{background:#fff4df;color:#91631b;border-radius:16px;padding:11px 13px;font-size:10px;margin:14px 0}</style></head><body><form class="card" id="form"><div class="logo">R</div><h1>Secure the first admin</h1><p>This one-time setup binds the initial RelayOS administrator to a real email and password. After completion, the bootstrap route locks itself.</p><div class="warn">Use the temporary bootstrap token supplied for this deployment. It is not your Meta token or OpenAI key.</div><div class="field"><label>Bootstrap token</label><input id="token" autocomplete="off" required/></div><div class="field"><label>Admin name</label><input id="name" value="Adwin" required/></div><div class="field"><label>Admin email</label><input id="email" type="email" autocomplete="username" required/></div><div class="field"><label>New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required/></div><button class="btn" id="btn">Secure admin account</button><div class="msg" id="msg"></div></form><script>const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('btn');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='';try{const r=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token.value,name:name.value,email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed');m.textContent='Admin secured. Redirecting to login…';setTimeout(()=>location.replace('/login.html'),900)}catch(e){m.textContent=e.message}finally{b.disabled=false}}</script></body></html>
