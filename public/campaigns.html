<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaigns · RelayOS</title><link rel="stylesheet" href="/relay-ui.css"><style>body{margin:0;background:#f6f7f9;font-family:Inter,system-ui;color:#17181d}.page{max-width:1280px;margin:0 auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h1{margin:0;font-size:34px}.muted{color:#888c95;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e6e7ec;border-radius:22px;padding:18px}.stat b{display:block;font-size:26px;margin-top:4px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.item{padding:12px 0;border-top:1px solid #eee}.badge{display:inline-flex;border-radius:999px;background:#f1efff;color:#6652d8;padding:4px 8px;font-size:10px;font-weight:700}.btn{border:0;border-radius:999px;background:#1d1e23;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:#efeff3;color:#333}.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}</style></head><body><div class="page"><div class="head"><div><span class="badge">OUTBOUND ORCHESTRATION</span><h1>Campaign Governor</h1><p class="muted">DBID + TCID + WhatsApp Group + controlled queue and pacing.</p></div><button class="btn" onclick="loadAll()">Refresh</button></div><div class="grid" id="stats"></div><div class="cols"><div class="card"><h3>Campaigns</h3><div id="campaigns"></div></div><div class="card"><h3>Resources</h3><div id="resources"></div></div></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function act(id,a){await api('/api/v1/campaigns/'+id+'/'+a,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});loadAll()}async function prep(id){await api('/api/v1/campaigns/'+id+'/prepare',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});loadAll()}async function loadAll(){const[s,c,d,t,g]=await Promise.all([api('/api/v1/campaigns/summary'),api('/api/v1/campaigns'),api('/api/v1/audiences'),api('/api/v1/chat-templates'),api('/api/v1/whatsapp-groups')]);stats.innerHTML=`<div class="card stat"><span class="muted">Campaigns</span><b>${s.campaigns.total}</b></div><div class="card stat"><span class="muted">Running</span><b>${s.campaigns.running}</b></div><div class="card stat"><span class="muted">Queued</span><b>${s.queue.queued}</b></div><div class="card stat"><span class="muted">Blocked</span><b>${s.queue.blocked}</b></div>`;campaigns.innerHTML=c.items.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="badge">${esc(x.status)}</span><div class="muted">${esc(x.campaign_code)} · ${esc(x.group_code)} · ${esc(x.db_code)} · ${esc(x.tc_code)} · ${x.queue_total} queue</div><div class="actions"><button class="btn secondary" onclick="prep('${x.id}')">Prepare queue</button><button class="btn secondary" onclick="act('${x.id}','approve')">Approve</button><button class="btn secondary" onclick="act('${x.id}','start')">Start</button><button class="btn secondary" onclick="act('${x.id}','pause')">Pause</button><button class="btn secondary" onclick="act('${x.id}','abort')">Abort</button></div></div>`).join('')||'<div class="muted">No campaigns yet. Create one from Command Center.</div>';resources.innerHTML=`<h4>Audience DB</h4>${d.items.map(x=>`<div class="item"><b>${esc(x.db_code)}</b> ${esc(x.name)}<div class="muted">${x.records} records · ${x.eligible} eligible</div></div>`).join('')||'<div class="muted">No DBID yet.</div>'}<h4>Templates</h4>${t.items.map(x=>`<div class="item"><b>${esc(x.tc_code)}</b> ${esc(x.name)}<div class="muted">${esc(x.status)} · ${x.approved?'approved':'not approved'}</div></div>`).join('')||'<div class="muted">No TCID yet.</div>'}<h4>Groups</h4>${g.items.map(x=>`<div class="item"><b>${esc(x.group_code)}</b> ${esc(x.name)}<div class="muted">${x.number_count} numbers · health ${x.avg_health}</div></div>`).join('')}`;}loadAll();</script></body></html>
