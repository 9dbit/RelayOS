<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RelayOS Login</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#17181c;background:#f6f7f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#ece8ff 0,transparent 30%),#f6f7f9}.card{width:min(430px,calc(100vw - 32px));background:#fff;border:1px solid #e9eaee;border-radius:30px;padding:34px;box-shadow:0 24px 70px #28253b12}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#806ef0,#5d49d8);display:grid;place-items:center;color:white;font-weight:800;margin-bottom:24px}h1{margin:0;font-size:29px}p{color:#858891;font-size:12px;line-height:1.6;margin:8px 0 24px}.field{margin:12px 0}.field label{display:block;font-size:10px;color:#777b84;margin:0 0 7px 4px}.field input{width:100%;border:1px solid #e1e2e6;border-radius:999px;padding:13px 16px;font:13px inherit;outline:0}.field input:focus{border-color:#9f92ef;box-shadow:0 0 0 4px #6d55e812}.btn{width:100%;border:0;border-radius:999px;background:#1e1f24;color:#fff;padding:13px 18px;font-weight:700;cursor:pointer;margin-top:10px}.msg{font-size:11px;margin-top:14px;color:#a44848;min-height:18px}.foot{margin-top:26px;border-top:1px solid #eee;padding-top:16px;font-size:10px;color:#999}.pill{display:inline-flex;border-radius:999px;background:#efebff;color:#5f4dc0;padding:5px 9px;font-size:9px;margin-bottom:14px}</style></head><body><form class="card" id="form"><div class="logo">R</div><span class="pill">Secure workspace</span><h1>Welcome back</h1><p>Sign in to RelayOS. Operator identity is now bound to a verified session, not a browser-selected header.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required/></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="10" required/></div><button class="btn" id="btn">Sign in</button><div class="msg" id="msg"></div><div class="foot">Session cookie: HttpOnly · Secure · SameSite=Lax · revocable</div></form><script>const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('btn');fetch('/api/auth/me').then(r=>r.ok?location.replace('/'):null).catch(()=>{});f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error==='invalid_credentials'?'Email or password is incorrect.':d.error||'Login failed');location.replace('/')}catch(e){m.textContent=e.message}finally{b.disabled=false}}</script></body></html>
