<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox Wall · RelayOS</title><link rel="stylesheet" href="/relay-ui.css"><style>:root{--bg:#f3f4f7;--ink:#17181d;--muted:#858995;--line:#e5e7eb;--brand:#befc4f;--amber:#c88a20}.iw-body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui;color:var(--ink);overflow:hidden}.iw-shell{height:100vh;display:flex;flex-direction:column}.iw-top{min-height:74px;display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);z-index:5}.iw-title{min-width:220px}.iw-title b{font-size:18px;display:block}.iw-title small{font-size:10px;color:var(--muted)}.iw-tools{display:flex;gap:8px;align-items:center;margin-left:auto}.iw-btn,.iw-search,.iw-filter{height:36px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 12px;font:11px inherit}.iw-btn{cursor:pointer;font-weight:700}.iw-btn.dark{background:#1d1f24;color:#fff;border-color:#1d1f24}.iw-search{width:220px}.iw-filter{min-width:170px}.iw-zoom{min-width:54px;text-align:center;font-size:11px;color:#666}.iw-stage{flex:1;position:relative;overflow:hidden;cursor:grab;background-image:radial-gradient(#d9dce4 1px,transparent 1px);background-size:24px 24px}.iw-stage.dragging{cursor:grabbing}.iw-canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;padding:36px;display:flex;gap:30px;align-items:flex-start}.iw-group{width:540px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 18px 45px rgba(25,28,36,.08)}.iw-group-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.iw-group-head h2{font-size:18px;margin:4px 0}.iw-group-head small{font-size:10px;color:var(--muted)}.iw-code{display:inline-flex;border-radius:999px;background:#eef7df;color:#4b631e;padding:5px 8px;font-size:9px;font-weight:800}.iw-numbers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.iw-number{background:#fff;border:1px solid #e9eaf0;border-radius:16px;padding:12px;min-height:280px}.iw-num-head{display:flex;gap:9px;align-items:center}.iw-wa{width:30px;height:30px;border-radius:10px;background:#1f2025;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.iw-num-head b{font-size:12px}.iw-num-head small{display:block;color:var(--muted);font-size:9px}.iw-badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.badge{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:8px;font-weight:800;background:#f2f3f6;color:#666}.badge.green{background:#eef7df;color:#4b631e}.badge.amber{background:#fff3d9;color:#98691d}.iw-feed{display:flex;flex-direction:column;gap:6px;margin-top:10px}.chat{padding:8px 9px;border-radius:12px;background:#f7f8fa;border:1px solid #eef0f3}.chat b{font-size:9px;display:flex;justify-content:space-between;gap:8px}.chat p{font-size:9px;line-height:1.4;margin:4px 0 0;color:#454851;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat small{font-size:8px;color:#9a9da5}.chat.real{background:#f6f8f0;border-color:#e6edd8}.iw-empty{font-size:9px;color:#aaa;padding:14px;text-align:center}.iw-legend{position:absolute;right:16px;bottom:16px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:9px;color:#666;z-index:4}.iw-loading{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:12px}.iw-status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--brand);margin-right:5px}.iw-alert{font-size:9px;color:#98691d;background:#fff3d9;border-radius:999px;padding:5px 8px}@media(max-width:900px){.iw-top{flex-wrap:wrap}.iw-title{min-width:140px}.iw-search{width:150px}.iw-filter{min-width:150px}.iw-group{width:430px}.iw-numbers{grid-template-columns:1fr}.iw-tools{width:100%;margin-left:0;overflow:auto}}</style></head><body class="iw-body"><div class="iw-shell"><div class="iw-top"><div class="iw-title"><b>Inbox Wall</b><small><span class="iw-status-dot"></span>Sticky group conversation canvas</small></div><input class="iw-search" id="search" placeholder="Filter number or customer..."><select class="iw-filter" id="groupFilter"><option value="">All groups</option></select><span id="runtimeAlert"></span><div class="iw-tools"><button class="iw-btn" id="zoomOut">−</button><span class="iw-zoom" id="zoomLabel">100%</span><button class="iw-btn" id="zoomIn">＋</button><button class="iw-btn" id="fit">Fit all</button><button class="iw-btn" id="reset">Reset</button><button class="iw-btn dark" id="refresh">Refresh</button></div></div><div class="iw-stage" id="stage"><div class="iw-loading" id="loading">Loading conversation wall…</div><div class="iw-canvas" id="canvas"></div><div class="iw-legend"><b>Controls</b>Wheel = zoom · Drag = pan · Double click group = focus</div></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),loading=document.getElementById('loading');let scale=1,x=24,y=24,drag=false,sx=0,sy=0,ox=0,oy=0,data=null;function apply(){canvas.style.transform=`translate(${x}px,${y}px) scale(${scale})`;zoomLabel.textContent=Math.round(scale*100)+'%'}function clampScale(v){return Math.max(.28,Math.min(2.4,v))}function setScale(next,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const old=scale;next=clampScale(next);const wx=(cx-x)/old,wy=(cy-y)/old;scale=next;x=cx-wx*scale;y=cy-wy*scale;apply()}stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();setScale(scale*(e.deltaY<0?1.11:.90),e.clientX-r.left,e.clientY-r.top)},{passive:false});stage.addEventListener('pointerdown',e=>{if(e.target.closest('.iw-number,.iw-btn,.iw-search,.iw-filter'))return;drag=true;stage.classList.add('dragging');sx=e.clientX;sy=e.clientY;ox=x;oy=y;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;x=ox+(e.clientX-sx);y=oy+(e.clientY-sy);apply()});stage.addEventListener('pointerup',()=>{drag=false;stage.classList.remove('dragging')});zoomIn.onclick=()=>setScale(scale*1.15);zoomOut.onclick=()=>setScale(scale*.86);reset.onclick=()=>{scale=1;x=24;y=24;apply()};fit.onclick=fitAll;refresh.onclick=load;search.oninput=render;groupFilter.onchange=render;function fitAll(){requestAnimationFrame(()=>{const w=canvas.scrollWidth||1,h=canvas.scrollHeight||1;scale=clampScale(Math.min((stage.clientWidth-80)/w,(stage.clientHeight-80)/h,1));x=40;y=40;apply()})}function qMatch(q,vals){if(!q)return true;q=q.toLowerCase();return vals.some(v=>String(v||'').toLowerCase().includes(q))}function fmt(v){if(!v)return'';try{return new Date(v).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return''}}function card(n,g,q){const chats=(n.conversations||[]).filter(c=>c._resolved_group_id===g.id&&qMatch(q,[c.customer_name,c.customer_phone,c.last_message,c._resolved_group_name])).map(c=>`<div class="chat"><b><span>${esc(c.customer_name||c.customer_phone)}</span><small>${Number(c.unread_count||0)?esc(c.unread_count)+' new':''}</small></b><p>${esc(c.last_message||'No message yet')}</p><small>${esc(c.status)} · ${esc(c._resolved_group_code||'')} · ${fmt(c.last_message_at)}</small></div>`).join('');const real=(n.real_messages||[]).filter(m=>qMatch(q,[m.content,m.peer_name,m.thread_code])).map(m=>`<div class="chat real"><b><span>⚡ ${esc(m.peer_name||'Agent')}</span><small>${esc(m.thread_code)}</small></b><p>${esc(m.content)}</p><small>REAL WA · ${esc(m.delivery_status)} · ${fmt(m.created_at)}</small></div>`).join('');return`<div class="iw-number"><div class="iw-num-head"><div class="iw-wa">WA</div><div><b>${esc(n.name)}</b><small>${esc(n.phone)}</small></div></div><div class="iw-badges"><span class="badge ${Number(n.health_score)>=80?'green':'amber'}">Health ${esc(n.health_score)}</span>${n.is_primary?'<span class="badge green">PRIMARY</span>':''}</div><div class="iw-feed">${real}${chats||(!real?'<div class="iw-empty">No recent conversations in this group</div>':'')}</div></div>`}function render(){if(!data)return;const q=search.value.trim().toLowerCase(),gf=groupFilter.value;const groups=(data.groups||[]).filter(g=>(!gf||g.id===gf)&&(qMatch(q,[g.name,g.group_code,g.brand,g.department,g.region])||(g.numbers||[]).some(n=>qMatch(q,[n.name,n.phone])||(n.conversations||[]).some(c=>c._resolved_group_id===g.id&&qMatch(q,[c.customer_name,c.customer_phone,c.last_message])))));canvas.innerHTML=groups.map(g=>`<section class="iw-group" data-group="${esc(g.id)}"><div class="iw-group-head"><div><span class="iw-code">${esc(g.group_code)}</span><h2>${esc(g.name)}</h2><small>${esc([g.brand,g.department,g.region].filter(Boolean).join(' · ')||'No scope')}</small></div><span class="badge green">${g.numbers.length} numbers</span></div><div class="iw-numbers">${g.numbers.map(n=>card(n,g,q)).join('')||'<div class="iw-empty">No numbers assigned</div>'}</div></section>`).join('')||'<div class="iw-empty">No matching groups</div>';document.querySelectorAll('.iw-group').forEach(el=>el.addEventListener('dblclick',()=>focusGroup(el)))}function focusGroup(el){const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect();const target=Math.min(1.25,Math.max(.55,Math.min((stage.clientWidth*.8)/(r.width/scale),(stage.clientHeight*.8)/(r.height/scale))));const rawLeft=(r.left-sr.left-x)/scale,rawTop=(r.top-sr.top-y)/scale;scale=target;x=(stage.clientWidth-(r.width/scale)*target)/2-rawLeft*target;y=(stage.clientHeight-(r.height/scale)*target)/2-rawTop*target;apply()}async function enrichGroups(d){const conv=[];(d.groups||[]).forEach(g=>(g.numbers||[]).forEach(n=>(n.conversations||[]).forEach(c=>conv.push(c))));await Promise.all(conv.map(async c=>{try{const r=await fetch(`/api/v1/conversations/${c.id}/group-context`);if(!r.ok)return;const x=await r.json();c._resolved_group_id=x.group_id||null;c._resolved_group_code=x.group_code||'';c._resolved_group_name=x.group_name||''}catch{}}));return d}async function load(){loading.style.display='grid';try{const [r,s]=await Promise.all([fetch('/api/v1/inbox-wall'),fetch('/api/v1/group-runtime/status')]);if(r.status===401){location.href='/login.html';return}const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');data=await enrichGroups(d);groupFilter.innerHTML='<option value="">All groups</option>'+data.groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)} · ${esc(g.group_code)}</option>`).join('');if(s.ok){const st=await s.json();runtimeAlert.innerHTML=st.ambiguous_sender_mappings?`<span class="iw-alert">${st.ambiguous_sender_mappings} ambiguous sender mapping(s)</span>`:''}render();if(!canvas.dataset.init){canvas.dataset.init='1';fitAll()}}catch(e){canvas.innerHTML=`<div class="iw-empty">${esc(e.message)}</div>`}finally{loading.style.display='none'}}apply();load();setInterval(load,7000);</script></body></html>
