<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f7f8fa"/><title>RelayOS</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>new MutationObserver(()=>{for(const b of document.querySelectorAll('button')){if((b.textContent||'').trim().includes('Add WhatsApp number')&&!b.dataset.onboarding){b.dataset.onboarding='1';b.addEventListener('click',()=>location.href='/onboarding.html')}}}).observe(document.body,{childList:true,subtree:true});</script></body></html>
